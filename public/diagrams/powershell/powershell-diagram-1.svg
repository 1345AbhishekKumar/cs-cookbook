<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 244" role="img" aria-label="Four stages after you press Enter: you type text, PowerShell reads that text and finds a pipeline, the commands run and produce objects, and only at the very end does something draw those objects as a table for your eyes"><defs><style>

:root{
  --bg:        #faf8f3;
  --paper:     #fffefb;
  --ink:       #1a1a1a;
  --ink-2:     #565656;
  --ink-3:     #8f8f8f;
  --ink-4:     #b8b3a8;
  --rule:      #ded9ce;
  --rule-2:    #ece8df;
  --accent:    #a03a2e;
  --accent-2:  #c9624f;
  --code-bg:   #1b1d21;
  --code-ink:  #cfcbc3;
  --code-dim:  #6b7280;
  --code-out:  #8fbf9f;
  --warn:      #a03a2e;
  --warn-bg:   #fbf1ee;
  --tip:       #3f6b4a;
  --tip-bg:    #eff5f0;
  --note:      #8a6a20;
  --note-bg:   #faf4e4;
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
  --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;}
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  font-feature-settings:"kern" 1, "liga" 1, "calt" 1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{ background:#f0d9d4; color:var(--ink); }
a{ color:inherit; text-decoration:none; }
a:hover{ color:var(--accent); }
code, kbd, pre{ font-family:var(--mono); }
code{ font-size:0.86em; background:#efece4; padding:1px 5px; border-radius:3px; color:#2a2a2a; }
pre code{ background:none; padding:0; font-size:1em; color:inherit; }
kbd{ font-size:0.78em; background:#fffefb; border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; padding:1px 5px; color:#333; }


.masthead{ border-bottom:1px solid var(--rule); padding:0 0 40px; margin-bottom:0; }
.masthead-inner{ max-width:1240px; margin:0 auto; padding:56px 32px 0; }
.kicker{ font-family:var(--mono); font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:28px; }
.kicker::before{ content:""; display:inline-block; width:32px; height:1px; background:var(--accent); vertical-align:middle; margin-right:12px; position:relative; top:-2px; }
h1.title{ font-family:var(--serif); font-weight:400; font-size:clamp(2rem, 5vw, 3.6rem); line-height:1.05; letter-spacing:-0.02em; margin:0 0 24px; max-width:16ch; color:var(--ink); }
h1.title em{ font-style:italic; color:var(--accent); }
.lede{ font-size:clamp(1rem, 1.4vw, 1.15rem); line-height:1.55; color:var(--ink-2); max-width:62ch; margin:0 0 32px; }
.meta-row{ display:flex; flex-wrap:wrap; gap:0 28px; font-family:var(--mono); font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-3); }
.meta-row span::before{ content:"·"; margin-right:10px; color:var(--ink-4); }
.meta-row span:first-child::before{ content:none; margin:0; }


.layout{ max-width:1240px; margin:0 auto; padding:0 32px; display:grid; grid-template-columns:220px 1fr; gap:64px; align-items:start; }
@media (max-width:960px){
  .layout{ grid-template-columns:1fr; gap:0; padding:0 24px; }
  .masthead-inner{ padding:40px 24px 0; }
}


aside.toc{ position:sticky; top:0; max-height:100vh; overflow-y:auto; padding:40px 0 40px; font-size:0.8rem; line-height:1.5; scrollbar-width:thin; scrollbar-color:var(--rule) transparent; }
aside.toc::-webkit-scrollbar{ width:4px; }
aside.toc::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:2px; }
aside.toc::-webkit-scrollbar-track{ background:transparent; }
@media (max-width:960px){
  aside.toc{ position:static; max-height:none; overflow:visible; padding:32px 0; border-bottom:1px solid var(--rule); margin-bottom:8px; }
}
.toc-filter{ width:100%; background:transparent; border:0; border-bottom:1px solid var(--rule); padding:6px 0; font-family:var(--mono); font-size:0.78rem; color:var(--ink); margin-bottom:28px; outline:none; transition:border-color .15s; }
.toc-filter::placeholder{ color:var(--ink-4); font-family:var(--mono); font-size:0.78rem; }
.toc-filter:focus{ border-bottom-color:var(--accent); }
.toc-group{ margin-bottom:22px; }
.toc-group-title{ font-family:var(--mono); font-size:0.65rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--rule-2); }
.toc-group a{ display:block; padding:3px 0; color:var(--ink-2); font-size:0.82rem; border-bottom:1px solid transparent; transition:color .12s; }
.toc-group a:hover{ color:var(--accent); }
.toc-group a .n{ font-family:var(--mono); font-size:0.7rem; color:var(--ink-4); margin-right:8px; display:inline-block; min-width:20px; }
.toc-group a:hover .n{ color:var(--accent); }


main{ padding:40px 0 0; min-width:0; }
section.block{ padding-bottom:56px; margin-bottom:56px; border-bottom:1px solid var(--rule); }
section.block:last-child{ border-bottom:0; }
.section-head{ margin-bottom:32px; }
.section-label{ font-family:var(--mono); font-size:0.65rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:14px; }
h2.section-title{ font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem, 2.6vw, 2rem); line-height:1.15; letter-spacing:-0.015em; margin:0 0 12px; color:var(--ink); }
.section-sub{ font-size:0.95rem; color:var(--ink-2); max-width:60ch; margin:0; line-height:1.55; }


.cmd{ position:relative; padding:28px 0 28px 68px; border-top:1px solid var(--rule-2); scroll-margin-top:24px; }

.cmd:first-child,
.section-head + .cmd{ border-top:1px solid var(--rule); padding-top:36px; }
@media (max-width:600px){
  .cmd{ padding-left:0; padding-top:32px; }
}
.cmd-num{ position:absolute; left:0; top:31px; font-family:var(--mono); font-size:0.75rem; color:var(--accent); opacity:0.55; letter-spacing:0.05em; }
@media (max-width:600px){
  .cmd-num{ position:static; display:block; margin-bottom:8px; opacity:1; }
}
h3.cmd-name{ font-family:var(--mono); font-weight:600; font-size:1.15rem; letter-spacing:-0.01em; margin:0 0 4px; color:var(--ink); line-height:1.3; }
h3.cmd-name .dash{ color:var(--ink-4); font-weight:400; margin:0 8px 0 4px; }
.cmd-tagline{ font-family:var(--serif); font-style:italic; font-size:1rem; color:var(--ink-2); margin:0 0 18px; line-height:1.5; }
.syntax{ display:block; font-family:var(--mono); font-size:0.82rem; color:var(--ink-2); padding:8px 0 8px 18px; border-left:2px solid var(--rule); margin:0 0 18px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
.syntax::before{ content:"→ "; color:var(--accent); opacity:0.6; }
.cmd p{ margin:0 0 14px; color:var(--ink); }
.cmd h4{ font-family:var(--sans); font-size:0.78rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-2); margin:24px 0 8px; }

ul,ol{ margin:0 0 16px; padding-left:22px; color:var(--ink); }
li{ margin-bottom:5px; line-height:1.6; }
li::marker{ color:var(--ink-4); }


pre{ background:var(--code-bg); color:var(--code-ink); padding:16px 20px; border-radius:3px; overflow-x:auto; font-size:0.82rem; line-height:1.7; margin:14px 0 18px; font-family:var(--mono); -webkit-overflow-scrolling:touch; }
pre .c{ color:var(--code-dim); font-style:italic; }
pre .p{ color:var(--code-out); }
pre::-webkit-scrollbar{ height:6px; }
pre::-webkit-scrollbar-thumb{ background:#3a3d44; border-radius:3px; }
pre::-webkit-scrollbar-track{ background:transparent; }


.tip,.warn,.note{ position:relative; padding:14px 18px 14px 18px; margin:16px 0; font-size:0.9rem; line-height:1.6; border-left:2px solid; border-radius:0; }
.tip{ background:var(--tip-bg); border-color:var(--tip); }
.warn{ background:var(--warn-bg); border-color:var(--warn); }
.note{ background:var(--note-bg); border-color:var(--note); }
.tip::before,.warn::before,.note::before{ font-family:var(--mono); font-size:0.62rem; letter-spacing:0.16em; text-transform:uppercase; display:block; margin-bottom:6px; }
.tip::before{ content:"Tip"; color:var(--tip); }
.warn::before{ content:"Warning"; color:var(--warn); }
.note::before{ content:"Note"; color:var(--note); }
.tip strong:first-child,
.warn strong:first-child,
.note strong:first-child{ display:none; }
.tip pre,.warn pre,.note pre{ margin:10px 0 0; font-size:0.76rem; }


table{ width:100%; border-collapse:collapse; margin:16px 0 20px; font-size:0.87rem; line-height:1.55; }
thead th{ text-align:left; font-family:var(--mono); font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 12px 8px 0; border-bottom:1px solid var(--ink-4); }
tbody td{ padding:10px 12px 10px 0; border-bottom:1px solid var(--rule-2); vertical-align:top; color:var(--ink); }
tbody tr:last-child td{ border-bottom:1px solid var(--rule); }
tbody td:first-child{ white-space:nowrap; }
tbody code{ font-size:0.85em; background:#efece4; }


.pill-row{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; }
.pill{ font-family:var(--mono); font-size:0.75rem; padding:4px 10px; background:#fffefb; border:1px solid var(--rule); border-radius:2px; color:var(--ink-2); }


footer{ border-top:1px solid var(--rule); margin-top:40px; padding:36px 32px 64px; max-width:1240px; margin-left:auto; margin-right:auto; font-family:var(--mono); font-size:0.72rem; letter-spacing:0.06em; color:var(--ink-3); line-height:1.9; }
footer .foot-mark{ color:var(--accent); opacity:0.6; }


.to-top{ position:fixed; right:28px; bottom:28px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:var(--paper); border:1px solid var(--rule); border-radius:2px; font-family:var(--mono); font-size:0.9rem; color:var(--ink-2); opacity:0; pointer-events:none; transition:opacity .2s, color .15s, border-color .15s; cursor:pointer; z-index:20; }
.to-top.visible{ opacity:1; pointer-events:auto; }
.to-top:hover{ color:var(--accent); border-color:var(--accent); }


.hidden{ display:none !important; }
em{ font-style:italic; }
strong{ font-weight:600; color:var(--ink); }

dl.deflist{ margin:14px 0 18px; }
dl.deflist dt{ font-family:var(--mono); font-size:0.85rem; color:var(--ink); margin-top:10px; }
dl.deflist dd{ margin:2px 0 0 0; padding-left:0; color:var(--ink-2); font-size:0.9rem; line-height:1.6; }


.fig{ margin:26px 0 30px; padding:20px 20px 14px; background:var(--paper); border:1px solid var(--rule); border-radius:3px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.fig svg{ display:block; width:100%; min-width:560px; height:auto; }
.fig::-webkit-scrollbar{ height:6px; }
.fig::-webkit-scrollbar-thumb{ background:#3a3d44; border-radius:3px; opacity:0.5; }
@media print{ .fig{ overflow:visible; break-inside:avoid; } .fig svg{ min-width:0; } }
.fig figcaption{ margin-top:14px; padding-top:12px; border-top:1px solid var(--rule-2); font-family:var(--mono); font-size:0.7rem; letter-spacing:0.03em; line-height:1.75; color:var(--ink-3); }
.fig figcaption b{ color:var(--ink-2); font-weight:600; }
.fig text{ font-family:var(--mono); font-size:11px; fill:var(--ink-2); }
.fig .sm{ font-size:9.5px; }
.fig .xs{ font-size:8.5px; }
.fig .lbl{ font-size:8.5px; letter-spacing:0.12em; fill:var(--ink-3); }
.fig .ctr{ text-anchor:middle; }
.fig .mono-b{ font-weight:600; }
.fig .box{ fill:var(--paper); stroke:var(--rule); stroke-width:1; }
.fig .box2{ fill:#f4f1ea; stroke:var(--rule); stroke-width:1; }
.fig .dim{ fill:#faf8f3; stroke:var(--ink-4); stroke-width:1; }
.fig .accbox{ fill:#fbf1ee; stroke:#a03a2e; stroke-width:1.2; }
.fig .okbox{ fill:#eff5f0; stroke:#3f6b4a; stroke-width:1.2; }
.fig .acc{ stroke:#a03a2e; }
.fig .accf{ fill:#a03a2e; }
.fig .ok{ stroke:#3f6b4a; }
.fig .okf{ fill:#3f6b4a; }
.fig .edge{ stroke:var(--ink-4); stroke-width:1.1; fill:none; }
.fig .edgeA{ stroke:#a03a2e; stroke-width:1.4; fill:none; }
.fig .edgeO{ stroke:#3f6b4a; stroke-width:1.4; fill:none; }
.fig .dash{ stroke:var(--ink-4); stroke-width:1; fill:none; stroke-dasharray:5 4; }
.fig .dashA{ stroke:#a03a2e; stroke-width:1.2; fill:none; stroke-dasharray:5 4; }
.fig .head{ fill:var(--ink-4); }
.fig .headA{ fill:#a03a2e; }
.fig .headO{ fill:#3f6b4a; }
.fig .mk{ fill:#a03a2e; }
.fig .mkd{ fill:var(--tip); }
.fig .draw{ stroke-dasharray:100; }
.fig .flow{ stroke-dasharray:4 7; }

@media (prefers-reduced-motion: no-preference){
  .fig.play .fade{ animation:fadeIn .5s ease-out both; }
  .fig.play .rise{ animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both; }
  .fig.play .slide{ animation:slideIn .6s cubic-bezier(.2,.7,.3,1) both; }
  .fig.play .draw{ animation:drawIn .7s ease-out both; }
  .fig.play .pulse{ animation:pulseIn 1.5s ease-out both; }
  .fig.play .reclaim{ animation:reclaim 1.1s ease-out both; }
  .fig.play .flow{ animation:flow 1.4s linear infinite; }
  .fig.play .dl1{ animation-delay:.15s; }
  .fig.play .dl2{ animation-delay:.3s; }
  .fig.play .dl3{ animation-delay:.45s; }
  .fig.play .dl4{ animation-delay:.6s; }
  .fig.play .dl5{ animation-delay:.75s; }
  .fig.play .dl6{ animation-delay:.9s; }
  .fig.play .dl7{ animation-delay:1.05s; }
  .fig.play .dl8{ animation-delay:1.2s; }
  .fig.play .dl9{ animation-delay:1.35s; }
  .fig.play .dl10{ animation-delay:1.5s; }
  .fig.play .dl11{ animation-delay:1.65s; }
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes riseIn{ from{ opacity:0; transform:translate(0,10px); } to{ opacity:1; transform:translate(0,0); } }
@keyframes slideIn{ from{ opacity:0; transform:translate(-20px,0); } to{ opacity:1; transform:translate(0,0); } }
@keyframes drawIn{ from{ stroke-dashoffset:100; } to{ stroke-dashoffset:0; } }
@keyframes pulseIn{ 0%{ opacity:.2; } 35%{ opacity:1; } 55%{ opacity:.4; } 100%{ opacity:1; } }
@keyframes reclaim{ from{ fill:#fbf1ee; stroke:#a03a2e; } to{ fill:#eff5f0; stroke:#3f6b4a; } }
@keyframes flow{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:-22; } }
</style></defs>
          <text class="lbl ctr" x="330" y="18">WHAT HAPPENS WHEN YOU PRESS ENTER</text>

          <rect class="box2 fade dl1" x="20" y="36" width="132" height="80"/>
          <text class="xs ctr mono-b" x="86" y="56">1 &middot; YOU TYPE TEXT</text>
          <text class="xs ctr" x="86" y="76">Get-Process |</text>
          <text class="xs ctr" x="86" y="90">Where-Object CPU</text>
          <text class="xs ctr" x="86" y="104">-gt 50</text>

          <path class="edgeA draw dl2" pathLength="100" d="M154 76 H180"/>
          <polygon class="headA fade dl2" points="-6,-4 -6,4 0,0" transform="translate(180,76)"/>

          <rect class="box fade dl2" x="182" y="36" width="132" height="80"/>
          <text class="xs ctr mono-b" x="248" y="56">2 &middot; IT IS READ</text>
          <text class="xs ctr" x="248" y="78">PowerShell splits the</text>
          <text class="xs ctr" x="248" y="92">line up and sees a</text>
          <text class="xs ctr" x="248" y="106">pipeline: two commands</text>

          <path class="edgeA draw dl3" pathLength="100" d="M316 76 H342"/>
          <polygon class="headA fade dl3" points="-6,-4 -6,4 0,0" transform="translate(342,76)"/>

          <rect class="okbox pulse dl3" x="344" y="36" width="132" height="80"/>
          <text class="xs ctr mono-b" x="410" y="56">3 &middot; COMMANDS RUN</text>
          <text class="xs ctr" x="410" y="78">Get-Process hands out</text>
          <text class="xs ctr" x="410" y="92">objects; Where-Object</text>
          <text class="xs ctr" x="410" y="106">takes them in</text>

          <path class="edgeA draw dl4" pathLength="100" d="M478 76 H504"/>
          <polygon class="headA fade dl4" points="-6,-4 -6,4 0,0" transform="translate(504,76)"/>

          <rect class="box fade dl4" x="506" y="36" width="134" height="80"/>
          <text class="xs ctr mono-b" x="573" y="56">4 &middot; YOU SEE A TABLE</text>
          <text class="xs ctr" x="573" y="78">the surviving objects</text>
          <text class="xs ctr" x="573" y="92">are drawn as columns</text>
          <text class="xs ctr" x="573" y="106">to fit your window</text>

          <rect class="okbox pulse dl6" x="20" y="140" width="620" height="58"/>
          <text class="xs ctr mono-b" x="330" y="162">THE OBJECT SURVIVES EVERY STEP</text>
          <text class="xs ctr" x="330" y="180">Step 1 is the only text in the whole sequence. Step 4 is a drawing made for your eyes,</text>
          <text class="xs ctr" x="330" y="193">and it is thrown away the moment it is printed. Printers and people get text; commands get objects.</text>
        </svg>