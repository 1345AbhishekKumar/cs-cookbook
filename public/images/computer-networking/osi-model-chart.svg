<text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">OSI 7-Layer Model</text>
<g font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
<rect x="180" y="60" width="440" height="56" rx="8" fill="#ec4899"/><text x="400" y="95" fill="#fff">7. Application — Data</text>
<rect x="180" y="122" width="440" height="56" rx="8" fill="#a855f7"/><text x="400" y="157" fill="#fff">6. Presentation — Data</text>
<rect x="180" y="184" width="440" height="56" rx="8" fill="#6366f1"/><text x="400" y="219" fill="#fff">5. Session — Data</text>
<rect x="180" y="246" width="440" height="56" rx="8" fill="#0284c7"/><text x="400" y="281" fill="#fff">4. Transport — Segment</text>
