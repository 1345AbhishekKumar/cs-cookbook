<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="940" height="520" rx="12" fill="url(#bgGrad)"/>
  
  <text x="470" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">
    Layer 4 Header Architecture: TCP (20-60B) vs. UDP (8B)
  </text>
  <text x="470" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    32-bit row alignment, tracking metadata overhead, and payload capacity comparison
  </text>

  <!-- Left: TCP Header -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="520" height="395" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="34" rx="8" fill="#0284c7"/>
    <text x="260" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      TCP Header (RFC 793) — 20 to 60 Bytes
    </text>

    <!-- Bits ruler -->
    <rect x="15" y="44" width="490" height="20" fill="#0f172a" rx="4"/>
    <text x="20" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 0</text>
    <text x="135" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 15</text>
    <text x="265" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 16</text>
    <text x="475" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 31</text>

    <!-- Row 1: Ports -->
    <g transform="translate(15, 70)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="242" height="42" fill="#0369a1" rx="4"/>
      <text x="121" y="26" fill="#f0f9ff">Source Port (16 bits)</text>
      <rect x="248" y="0" width="242" height="42" fill="#0284c7" rx="4"/>
      <text x="369" y="26" fill="#f0f9ff">Destination Port (16 bits)</text>
    </g>

    <!-- Row 2: Sequence Number -->
    <g transform="translate(15, 118)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="490" height="42" fill="#2563eb" rx="4"/>
      <text x="245" y="26" fill="#ffffff">Sequence Number (32 bits) — Byte Stream Ordering</text>
    </g>

    <!-- Row 3: Acknowledgment Number -->
    <g transform="translate(15, 166)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="490" height="42" fill="#1d4ed8" rx="4"/>
      <text x="245" y="26" fill="#ffffff">Acknowledgment Number (32 bits) — Cumulative ACK (Next Expected)</text>
    </g>

    <!-- Row 4: Offset, Flags, Window -->
    <g transform="translate(15, 214)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="65" height="42" fill="#475569" rx="3"/>
      <text x="32" y="25" fill="#f8fafc">Offset 4b</text>
      <rect x="68" y="0" width="55" height="42" fill="#334155" rx="3"/>
      <text x="95" y="25" fill="#cbd5e1">Res 3b</text>
      <rect x="126" y="0" width="186" height="42" fill="#7c3aed" rx="3"/>
      <text x="219" y="20" fill="#f5f3ff" font-size="10">9 Flags (SYN, ACK, FIN,</text>
      <text x="219" y="34" fill="#f5f3ff" font-size="10">RST, PSH, URG, ECE, CWR)</text>
      <rect x="315" y="0" width="175" height="42" fill="#0d9488" rx="3"/>
      <text x="402" y="26" fill="#ccfbf1">Window Size 16b (Flow Control)</text>
    </g>

    <!-- Row 5: Checksum, Urgent -->
    <g transform="translate(15, 262)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="242" height="42" fill="#047857" rx="4"/>
      <text x="121" y="26" fill="#d1fae5">TCP Checksum (16 bits)</text>
      <rect x="248" y="0" width="242" height="42" fill="#475569" rx="4"/>
      <text x="369" y="26" fill="#f1f5f9">Urgent Pointer (16 bits)</text>
    </g>

    <!-- Row 6: Options -->
    <g transform="translate(15, 310)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="490" height="36" fill="#334155" stroke="#475569" stroke-dasharray="4,3" rx="4"/>
      <text x="245" y="23" fill="#cbd5e1">Options (0 - 40 bytes) — MSS, Window Scaling, SACK, Timestamps</text>
    </g>

    <text x="260" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">
      Minimum TCP Header: 20 Bytes | Maximum: 60 Bytes
    </text>
  </g>

  <!-- Right: UDP Header -->
  <g transform="translate(580, 85)" filter="url(#shadow)">
    <rect width="330" height="395" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="34" rx="8" fill="#10b981"/>
    <text x="165" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      UDP Header (RFC 768) — 8 Bytes Total
    </text>

    <!-- Bits ruler -->
    <rect x="15" y="44" width="300" height="20" fill="#0f172a" rx="4"/>
    <text x="20" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 0</text>
    <text x="150" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 15</text>
    <text x="175" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 16</text>
    <text x="285" y="58" font-family="monospace" font-size="10" fill="#64748b">Bit 31</text>

    <!-- Row 1: Ports -->
    <g transform="translate(15, 70)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="147" height="42" fill="#059669" rx="4"/>
      <text x="73" y="26" fill="#ecfdf5">Source Port (16b)</text>
      <rect x="153" y="0" width="147" height="42" fill="#10b981" rx="4"/>
      <text x="226" y="26" fill="#ffffff">Dest Port (16b)</text>
    </g>

    <!-- Row 2: Length & Checksum -->
    <g transform="translate(15, 118)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="147" height="42" fill="#047857" rx="4"/>
      <text x="73" y="26" fill="#ecfdf5">Length (16b)</text>
      <rect x="153" y="0" width="147" height="42" fill="#065f46" rx="4"/>
      <text x="226" y="26" fill="#d1fae5">Checksum (16b)</text>
    </g>

    <!-- Empty Payload space -->
    <g transform="translate(15, 172)">
      <rect x="0" y="0" width="300" height="150" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>
      <text x="150" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399">
        User Data Payload
      </text>
      <text x="150" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Starts immediately at byte 9!
      </text>
      <text x="150" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        Max Datagram Payload:
      </text>
      <text x="150" y="125" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">
        65,535 - 8 = 65,527 Bytes
      </text>
    </g>

    <text x="165" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#10b981">
      Zero Connection State | Zero Retransmit Delays
    </text>
    <text x="165" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
      Checksum detects corrupted packets (dropped by OS)
    </text>
  </g>
</svg>
