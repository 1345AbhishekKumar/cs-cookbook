<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="940" height="500" rx="12" fill="url(#pBg)"/>

  <text x="470" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">
    Distributed Architecture: Client-Server vs. Peer-to-Peer (P2P)
  </text>
  <text x="470" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Centralized bottleneck scaling vs. decentralized swarm bandwidth multiplication
  </text>

  <!-- Left: Client-Server -->
  <g transform="translate(35, 90)" filter="url(#pShadow)">
    <rect width="415" height="375" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="34" rx="8" fill="#dc2626"/>
    <text x="207" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      Client-Server Model (Centralized Bottleneck)
    </text>

    <!-- Central Server -->
    <rect x="145" y="55" width="125" height="60" rx="8" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
    <text x="207" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Central Server</text>
    <text x="207" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fecaca">Upload Pipe: U_s</text>

    <!-- Clients in a circle -->
    <circle cx="65" cy="190" r="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="65" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">C 1</text>

    <circle cx="207" cy="225" r="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="207" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">C 2</text>

    <circle cx="350" cy="190" r="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="350" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">C 3</text>

    <circle cx="115" cy="295" r="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">C 4</text>

    <circle cx="300" cy="295" r="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">C 5</text>

    <!-- Lines from Server to Clients -->
    <line x1="160" y1="115" x2="80" y2="165" stroke="#ef4444" stroke-width="2"/>
    <line x1="207" y1="115" x2="207" y2="195" stroke="#ef4444" stroke-width="2"/>
    <line x1="255" y1="115" x2="335" y2="165" stroke="#ef4444" stroke-width="2"/>
    <line x1="180" y1="115" x2="125" y2="270" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="235" y1="115" x2="290" y2="270" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>

    <text x="207" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f87171" font-weight="bold">
      Distribute Time: D_cs ≥ max(F / d_min, N · F / u_s)
    </text>
    <text x="207" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Bandwidth demand scales linearly with client count N!
    </text>
  </g>

  <!-- Right: P2P Swarm -->
  <g transform="translate(490, 90)" filter="url(#pShadow)">
    <rect width="415" height="375" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="34" rx="8" fill="#059669"/>
    <text x="207" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      Peer-to-Peer Swarm (BitTorrent Mesh)
    </text>

    <!-- Initial Seeder -->
    <rect x="145" y="45" width="125" height="42" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="207" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Initial Seeder (100%)</text>
    <text x="207" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Uploads chunks to swarm</text>

    <!-- Peers in a mesh exchanging chunks -->
    <!-- Peer 1 -->
    <circle cx="75" cy="160" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="75" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Peer A</text>
    <text x="75" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="#a7f3d0">[1, 2, 4]</text>

    <!-- Peer 2 -->
    <circle cx="340" cy="160" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="340" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Peer B</text>
    <text x="340" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="#a7f3d0">[3, 5, 6]</text>

    <!-- Peer 3 -->
    <circle cx="207" cy="210" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="207" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Peer C</text>
    <text x="207" y="222" text-anchor="middle" font-family="monospace" font-size="9" fill="#a7f3d0">[1, 3, 5]</text>

    <!-- Peer 4 -->
    <circle cx="105" cy="285" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="105" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Peer D</text>
    <text x="105" y="297" text-anchor="middle" font-family="monospace" font-size="9" fill="#a7f3d0">[2, 6]</text>

    <!-- Peer 5 -->
    <circle cx="310" cy="285" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Peer E</text>
    <text x="310" y="297" text-anchor="middle" font-family="monospace" font-size="9" fill="#a7f3d0">[4, 5, 6]</text>

    <!-- Inter-peer mesh interconnects -->
    <line x1="107" y1="160" x2="175" y2="200" stroke="#34d399" stroke-width="2"/>
    <line x1="308" y1="160" x2="239" y2="200" stroke="#34d399" stroke-width="2"/>
    <line x1="107" y1="160" x2="308" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="75" y1="192" x2="105" y2="253" stroke="#34d399" stroke-width="2"/>
    <line x1="340" y1="192" x2="310" y2="253" stroke="#34d399" stroke-width="2"/>
    <line x1="137" y1="285" x2="278" y2="285" stroke="#34d399" stroke-width="2"/>
    <line x1="175" y1="220" x2="125" y2="265" stroke="#34d399" stroke-width="1.5"/>
    <line x1="239" y1="220" x2="290" y2="265" stroke="#34d399" stroke-width="1.5"/>

    <text x="207" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" font-weight="bold">
      Self-Scaling: Total Bandwidth = u_s + Σ u_i
    </text>
    <text x="207" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Every downloader is also an uploader! Swarm scales gracefully.
    </text>
  </g>
</svg>
