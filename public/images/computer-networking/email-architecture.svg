<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="eArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="eArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="940" height="480" rx="12" fill="url(#eBg)"/>

  <text x="470" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
    Enterprise Email Architecture: SMTP, IMAP/POP3 &amp; Validation Triad
  </text>
  <text x="470" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Push submission, DNS MX resolution, transient queue retries, MTA relay, and mailbox synchronization
  </text>

  <!-- Flow boxes -->
  <g transform="translate(40, 95)" font-family="system-ui, sans-serif">
    <!-- Sender MUA -->
    <rect x="0" y="60" width="130" height="80" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <text x="65" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">Sender MUA</text>
    <text x="65" y="115" text-anchor="middle" font-size="11" fill="#94a3b8">Apple Mail / Outlook</text>
    <text x="65" y="130" text-anchor="middle" font-size="10" fill="#38bdf8">alice@company.com</text>

    <!-- Arrow 1: Submission -->
    <line x1="130" y1="100" x2="200" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#eArrow)"/>
    <text x="165" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#38bdf8">SMTP 587</text>
    <text x="165" y="120" text-anchor="middle" font-size="9" fill="#64748b">STARTTLS</text>

    <!-- Outbound MTA -->
    <rect x="210" y="45" width="160" height="110" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="290" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">Outbound MTA</text>
    <text x="290" y="95" text-anchor="middle" font-size="11" fill="#94a3b8">Postfix / SendGrid</text>
    <rect x="225" y="105" width="130" height="38" rx="4" fill="#0f172a"/>
    <text x="290" y="122" text-anchor="middle" font-size="10" fill="#facc15">Transient Mail Queue</text>
    <text x="290" y="136" text-anchor="middle" font-size="9" fill="#94a3b8">Retries for 48-72h</text>

    <!-- DNS MX Lookup callout -->
    <g transform="translate(260, -25)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#4338ca"/>
      <text x="90" y="17" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">DNS MX Resolution</text>
      <text x="90" y="31" text-anchor="middle" font-size="9" fill="#c7d2fe">Dig recipient MX records</text>
      <line x1="90" y1="40" x2="90" y2="68" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Arrow 2: Relay -->
    <line x1="370" y1="100" x2="490" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#eArrow)"/>
    <text x="430" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">SMTP Relay (Port 25)</text>
    <text x="430" y="120" text-anchor="middle" font-size="9" fill="#f59e0b">Direct Server-to-Server</text>

    <!-- Inbound MX / Gateway -->
    <rect x="500" y="45" width="170" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="585" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">Inbound MX Server</text>
    <text x="585" y="95" text-anchor="middle" font-size="11" fill="#94a3b8">mx.google.com</text>
    <rect x="515" y="105" width="140" height="38" rx="4" fill="#064e3b"/>
    <text x="585" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#6ee7b7">Auth Checkpoint</text>
    <text x="585" y="136" text-anchor="middle" font-size="9" fill="#a7f3d0">SPF + DKIM + DMARC</text>

    <!-- Arrow 3: Delivery to storage -->
    <line x1="670" y1="100" x2="730" y2="100" stroke="#34d399" stroke-width="2" marker-end="url(#eArrowGreen)"/>

    <!-- MDA / Storage -->
    <rect x="740" y="60" width="120" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="800" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">MDA (Mailbox)</text>
    <text x="800" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">Dovecot Storage</text>
    <text x="800" y="128" text-anchor="middle" font-size="9" fill="#c4b5fd">Maildir / Spool</text>
  </g>

  <!-- Bottom: Recipient retrieval -->
  <g transform="translate(640, 275)" font-family="system-ui, sans-serif">
    <rect x="0" y="50" width="220" height="80" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <text x="110" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">Recipient Client (MUA)</text>
    <text x="110" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">Gmail App / Webmail / Phone</text>
    <text x="110" y="118" text-anchor="middle" font-size="10" fill="#38bdf8">bob@example.com</text>

    <!-- Link down from MDA to Recipient -->
    <path d="M 160 -40 L 160 50" stroke="#34d399" stroke-width="2" marker-end="url(#eArrowGreen)" fill="none"/>
    <text x="195" y="10" font-size="11" font-weight="bold" fill="#34d399">IMAP (Port 993)</text>
    <text x="195" y="25" font-size="9" fill="#94a3b8">Multi-device sync</text>
  </g>

  <!-- Left Bottom: Comparison Table of POP3 vs IMAP -->
  <g transform="translate(40, 280)" font-family="system-ui, sans-serif">
    <rect width="560" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="bold" fill="#f8fafc">Retrieval Comparison: IMAP vs. POP3</text>
    
    <text x="20" y="58" font-size="12" font-weight="bold" fill="#38bdf8">IMAP (Internet Message Access Protocol - Port 993)</text>
    <text x="20" y="78" font-size="11" fill="#94a3b8">• Two-way live synchronization: messages stay on the central server.</text>
    <text x="20" y="94" font-size="11" fill="#94a3b8">• Changes made on iPhone (read, archived, deleted) reflect instantly on MacBook.</text>

    <text x="20" y="120" font-size="12" font-weight="bold" fill="#f59e0b">POP3 (Post Office Protocol v3 - Port 995)</text>
    <text x="20" y="140" font-size="11" fill="#94a3b8">• 3-State cycle: Authorization -> Transaction -> Update (Downloads &amp; deletes from server).</text>
  </g>
</svg>
