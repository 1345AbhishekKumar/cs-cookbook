<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
<rect width="800" height="340" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111">Encapsulation — Each Layer Adds a Header</text>
<g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
<rect x="60" y="60" width="680" height="54" rx="8" fill="#f59e0b"/><text x="400" y="93" fill="#000">Eth Header (MACs) — Layer 2</text>
<rect x="110" y="122" width="580" height="54" rx="8" fill="#10b981"/><text x="400" y="155" fill="#fff">IP Header (Src/Dst IP) — Layer 3</text>
<rect x="160" y="184" width="480" height="54" rx="8" fill="#0284c7"/><text x="400" y="217" fill="#fff">TCP Header (Ports, Seq) — Layer 4</text>
<rect x="210" y="246" width="300" height="54" rx="8" fill="#ec4899"/><text x="360" y="279" fill="#fff">HTTP Data</text>
<rect x="510" y="246" width="80" height="54" rx="8" fill="#ef4444"/><text x="550" y="279" fill="#fff">FCS</text>
</g>
<text x="400" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Local diagram for CS-cookbook. Frame = headers + data + trailer.</text>
</svg>
