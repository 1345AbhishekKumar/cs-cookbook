<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="920" height="480" rx="12" fill="url(#cBg)"/>
  
  <text x="460" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
    HTTP Cookie &amp; Stateful Session Lifecycle
  </text>
  <text x="460" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Overcoming HTTP Statelessness: Set-Cookie, Cookie Jar, Redis Session Store, and Security Flags
  </text>

  <!-- Actors -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
    <!-- Client -->
    <rect x="60" y="80" width="220" height="45" rx="8" fill="#0284c7"/>
    <text x="170" y="108" text-anchor="middle" fill="#ffffff">Client Browser (Cookie Jar)</text>

    <!-- Web/Auth Server -->
    <rect x="360" y="80" width="220" height="45" rx="8" fill="#6366f1"/>
    <text x="470" y="108" text-anchor="middle" fill="#ffffff">API Gateway / App Server</text>

    <!-- Database / Redis -->
    <rect x="660" y="80" width="200" height="45" rx="8" fill="#ef4444"/>
    <text x="760" y="108" text-anchor="middle" fill="#ffffff">Redis / Session Cache</text>
  </g>

  <!-- Lifelines -->
  <line x1="170" y1="135" x2="170" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="470" y1="135" x2="470" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="760" y1="135" x2="760" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 1: Login -->
  <line x1="175" y1="160" x2="460" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="152" text-anchor="middle" font-family="monospace" font-size="12" fill="#7dd3fc">
    1. POST /login {user: "alice", pass: "***"}
  </text>

  <!-- Server stores in Redis -->
  <line x1="475" y1="185" x2="750" y2="185" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="177" text-anchor="middle" font-family="monospace" font-size="11" fill="#fca5a5">
    2. SET sess:8f9a2 {user_id: 42} EX 86400
  </text>

  <!-- Step 2: Set-Cookie -->
  <line x1="465" y1="225" x2="180" y2="225" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="195" y="235" width="250" height="44" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="320" y="252" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#6ee7b7">
    HTTP 200 OK
  </text>
  <text x="320" y="268" text-anchor="middle" font-family="monospace" font-size="9" fill="#a7f3d0">
    Set-Cookie: sid=8f9a2; Secure; HttpOnly; SameSite=Strict
  </text>

  <!-- Cookie Jar action -->
  <rect x="65" y="285" width="210" height="34" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="170" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">
    Browser stores cookie in Jar for domain
  </text>

  <!-- Step 3: Next Request with Cookie -->
  <line x1="175" y1="340" x2="460" y2="340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="332" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc">
    3. GET /account/cart | Cookie: sid=8f9a2
  </text>

  <!-- Server checks Redis -->
  <line x1="475" y1="365" x2="750" y2="365" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="357" text-anchor="middle" font-family="monospace" font-size="11" fill="#fca5a5">
    4. GET sess:8f9a2 -> Valid (Alice)
  </text>

  <!-- Step 4: Response -->
  <line x1="465" y1="400" x2="180" y2="400" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="320" y="392" text-anchor="middle" font-family="monospace" font-size="11" fill="#a7f3d0">
    HTTP 200 OK [{cart: "Flight UA104", total: 450}]
  </text>

  <!-- Security callout bar -->
  <g transform="translate(60, 435)" font-family="system-ui, sans-serif" font-size="11">
    <text x="0" y="15" fill="#e2e8f0" font-weight="bold">Core Protections:</text>
    <text x="120" y="15" fill="#38bdf8">• Secure (HTTPS only)</text>
    <text x="280" y="15" fill="#f43f5e">• HttpOnly (blocks XSS theft)</text>
    <text x="470" y="15" fill="#f59e0b">• SameSite=Strict (blocks CSRF)</text>
    <text x="680" y="15" fill="#10b981">• First-party vs Third-party tracking</text>
  </g>
</svg>
