<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111">TCP 3-Way Handshake</text>
<g font-family="sans-serif" font-size="14" font-weight="bold">
<line x1="150" y1="60" x2="150" y2="300" stroke="#0284c7" stroke-width="4"/>
<line x1="650" y1="60" x2="650" y2="300" stroke="#10b981" stroke-width="4"/>
<text x="150" y="52" text-anchor="middle" fill="#0284c7">CLIENT</text>
<text x="650" y="52" text-anchor="middle" fill="#10b981">SERVER</text>
<line x1="150" y1="110" x2="650" y2="140" stroke="#0284c7" stroke-width="2"/>
<text x="400" y="112" text-anchor="middle" fill="#0284c7" font-size="13">1. SYN seq=100</text>
<line x1="650" y1="170" x2="150" y2="200" stroke="#10b981" stroke-width="2"/>
<text x="400" y="172" text-anchor="middle" fill="#10b981" font-size="13">2. SYN-ACK seq=300 ack=101</text>
<line x1="150" y1="230" x2="650" y2="260" stroke="#f59e0b" stroke-width="2"/>
<text x="400" y="232" text-anchor="middle" fill="#b45309" font-size="13">3. ACK seq=101 ack=301</text>
<rect x="270" y="284" width="260" height="32" rx="6" fill="#10b981"/>
<text x="400" y="305" text-anchor="middle" fill="#fff" font-size="13">ESTABLISHED</text>
</g>
<text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Local diagram. External ref: Tcp-handshake.svg on Wikimedia (public domain).</text>
</svg>
