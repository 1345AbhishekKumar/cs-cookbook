<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="ouGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">LDAP Directory Information Tree (DIT) Hierarchy</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Hierarchical Distinguished Name (DN) Mapping: Root (dc), Container (ou), Leaf (cn)</text>

  <!-- Connectors -->
  <!-- Root to OUs -->
  <path d="M 450 140 L 450 170 L 190 170 L 190 200" stroke="#475569" stroke-width="2" fill="none" />
  <path d="M 450 140 L 450 200" stroke="#475569" stroke-width="2" fill="none" />
  <path d="M 450 140 L 450 170 L 710 170 L 710 200" stroke="#475569" stroke-width="2" fill="none" />

  <!-- OU Eng to Leaves -->
  <path d="M 190 260 L 190 290 L 110 290 L 110 320" stroke="#475569" stroke-width="2" fill="none" />
  <path d="M 190 260 L 190 290 L 270 290 L 270 320" stroke="#475569" stroke-width="2" fill="none" />

  <!-- OU Ops to Leaf -->
  <path d="M 450 260 L 450 320" stroke="#475569" stroke-width="2" fill="none" />

  <!-- OU Sales to Leaf -->
  <path d="M 710 260 L 710 320" stroke="#475569" stroke-width="2" fill="none" />

  <!-- ROOT NODE -->
  <g filter="url(#shadow)">
    <rect x="310" y="95" width="280" height="48" rx="8" fill="url(#rootGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="450" y="125" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700">dc=corp, dc=example, dc=com</text>
  </g>

  <!-- OU NODES -->
  <!-- OU 1: Engineering -->
  <g filter="url(#shadow)">
    <rect x="75" y="200" width="230" height="52" rx="8" fill="url(#ouGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="190" y="224" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Organizational Unit</text>
    <text x="190" y="242" text-anchor="middle" fill="#f0f9ff" font-family="monospace" font-size="14">ou=Engineering</text>
  </g>

  <!-- OU 2: IT Operations -->
  <g filter="url(#shadow)">
    <rect x="335" y="200" width="230" height="52" rx="8" fill="url(#ouGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="450" y="224" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Organizational Unit</text>
    <text x="450" y="242" text-anchor="middle" fill="#f0f9ff" font-family="monospace" font-size="14">ou=IT-Operations</text>
  </g>

  <!-- OU 3: Sales -->
  <g filter="url(#shadow)">
    <rect x="595" y="200" width="230" height="52" rx="8" fill="url(#ouGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="710" y="224" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Organizational Unit</text>
    <text x="710" y="242" text-anchor="middle" fill="#f0f9ff" font-family="monospace" font-size="14">ou=Sales</text>
  </g>

  <!-- LEAF NODES -->
  <!-- Leaf 1: User Alice -->
  <g filter="url(#shadow)">
    <rect x="25" y="320" width="170" height="58" rx="8" fill="url(#leafGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="110" y="342" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">User Account</text>
    <text x="110" y="362" text-anchor="middle" fill="#ecfdf5" font-family="monospace" font-size="13">cn=Alice Chen</text>
  </g>

  <!-- Leaf 2: User Bob -->
  <g filter="url(#shadow)">
    <rect x="185" y="320" width="170" height="58" rx="8" fill="url(#leafGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="270" y="342" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Security Group</text>
    <text x="270" y="362" text-anchor="middle" fill="#ecfdf5" font-family="monospace" font-size="13">cn=Dev-Team</text>
  </g>

  <!-- Leaf 3: Server Device -->
  <g filter="url(#shadow)">
    <rect x="355" y="320" width="190" height="58" rx="8" fill="url(#leafGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="450" y="342" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Computer Object</text>
    <text x="450" y="362" text-anchor="middle" fill="#ecfdf5" font-family="monospace" font-size="13">cn=DC-PROD-01</text>
  </g>

  <!-- Leaf 4: User Charlie -->
  <g filter="url(#shadow)">
    <rect x="625" y="320" width="170" height="58" rx="8" fill="url(#leafGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="710" y="342" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">User Account</text>
    <text x="710" y="362" text-anchor="middle" fill="#ecfdf5" font-family="monospace" font-size="13">cn=David Miller</text>
  </g>

  <!-- DN Resolution Banner -->
  <g filter="url(#shadow)">
    <rect x="40" y="420" width="820" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="60" y="448" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Full Distinguished Name (DN) Syntax Example:</text>
    <text x="60" y="473" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600">dn: CN=Alice Chen, OU=Engineering, DC=corp, DC=example, DC=com</text>
  </g>
</svg>
