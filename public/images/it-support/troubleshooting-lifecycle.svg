<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="step6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="480" y="45" text-anchor="middle" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">The 6-Stage IT Troubleshooting Methodology</text>
  <text x="480" y="72" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13">Industry-standard diagnostic lifecycle: CompTIA A+ &amp; Google IT Professional Standard</text>

  <!-- Flow Arrows connecting rows -->
  <path d="M 285 170 L 335 170" stroke="#374151" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 615 170 L 665 170" stroke="#374151" stroke-width="3" stroke-dasharray="6,4" />
  <!-- Dropdown curved path from step 3 to step 4 -->
  <path d="M 800 240 C 800 280, 800 290, 800 300" stroke="#374151" stroke-width="3" stroke-dasharray="6,4" />
  <!-- Bottom row arrows right to left -->
  <path d="M 665 370 L 615 370" stroke="#374151" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 335 370 L 285 370" stroke="#374151" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Step 1 -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="105" width="250" height="135" rx="12" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="65" cy="135" r="16" fill="url(#step1Grad)" />
    <text x="65" y="141" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text>
    <text x="95" y="140" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Identify the Problem</text>
    <text x="50" y="172" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Inquire user &amp; ask open questions</text>
    <text x="50" y="194" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Review system &amp; app event logs</text>
    <text x="50" y="216" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Replicate symptoms in isolation</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#cardShadow)">
    <rect x="355" y="105" width="250" height="135" rx="12" fill="#1f2937" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="385" cy="135" r="16" fill="url(#step2Grad)" />
    <text x="385" y="141" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text>
    <text x="415" y="140" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Establish Probable Cause</text>
    <text x="370" y="172" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Question the obvious (power, cables)</text>
    <text x="370" y="194" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Consider recent changes or updates</text>
    <text x="370" y="216" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Divide &amp; conquer (Layer 1 upwards)</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#cardShadow)">
    <rect x="675" y="105" width="250" height="135" rx="12" fill="#1f2937" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="705" cy="135" r="16" fill="url(#step3Grad)" />
    <text x="705" y="141" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3</text>
    <text x="735" y="140" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Test Theory to Confirm</text>
    <text x="690" y="172" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Validate theory through testing</text>
    <text x="690" y="194" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• If theory confirmed, proceed</text>
    <text x="690" y="216" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• If disproven, establish new theory</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#cardShadow)">
    <rect x="675" y="300" width="250" height="135" rx="12" fill="#1f2937" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="705" cy="330" r="16" fill="url(#step4Grad)" />
    <text x="705" y="336" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4</text>
    <text x="735" y="335" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Plan of Action &amp; Fix</text>
    <text x="690" y="367" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Create step-by-step repair plan</text>
    <text x="690" y="389" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Identify potential side-effects</text>
    <text x="690" y="411" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Implement fix or escalate appropriately</text>
  </g>

  <!-- Step 5 -->
  <g filter="url(#cardShadow)">
    <rect x="355" y="300" width="250" height="135" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="385" cy="330" r="16" fill="url(#step5Grad)" />
    <text x="385" y="336" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">5</text>
    <text x="415" y="335" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Verify &amp; Prevent</text>
    <text x="370" y="367" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Verify full system functionality</text>
    <text x="370" y="389" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Have end-user confirm the fix</text>
    <text x="370" y="411" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Implement preventive countermeasures</text>
  </g>

  <!-- Step 6 -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="300" width="250" height="135" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5" />
    <circle cx="65" cy="330" r="16" fill="url(#step6Grad)" />
    <text x="65" y="336" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">6</text>
    <text x="95" y="335" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Document Everything</text>
    <text x="50" y="367" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Record problem, root cause &amp; fix</text>
    <text x="50" y="389" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Update ticketing knowledge base</text>
    <text x="50" y="411" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">• Close ticket with clear customer notes</text>
  </g>
</svg>
